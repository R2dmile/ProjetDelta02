<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ProjetDelta.BlazorHybrid</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="ProjetDelta.BlazorHybrid.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="js/projetDeltaDnD.js"></script>
    <script>
        window.projetDeltaScrollLog = function (elementId) {
            const el = document.getElementById(elementId);
            if (!el) return;
            el.scrollTop = el.scrollHeight;
        };
        window.projetDeltaFocusRoot = function (elementId) {
            const el = document.getElementById(elementId);
            if (el && typeof el.focus === 'function') {
                el.focus();
            }
        };
        // Drag payload helper kept for potential future use; current fallback uses click-to-move.
        window.projetDeltaDragPayload = function (ev) {
            try {
                if (!ev || !ev.dataTransfer) return;
                const idx = ev.target?.getAttribute('data-idx');
                ev.dataTransfer.setData('text/plain', idx ?? '0');
                ev.dataTransfer.effectAllowed = 'move';
                ev.dataTransfer.dropEffect = 'move';
            } catch { }
        };
    </script>

</body>

</html>
